# name repo_url ref repo_theme_path local_theme_path
#
# Add one repository per non-comment line using five whitespace-separated fields:
#
#   name repo_url ref repo_theme_path local_theme_path
#
# Fields:
#   name              Short unique source name. Use letters, numbers, dot, underscore, or dash.
#   repo_url          Git URL to clone.
#   ref               Branch, tag, or commit to sync.
#   repo_theme_path   Directory inside the repo that contains theme folders.
#   local_theme_path  Local cache directory for that source's theme folders.
#
# Use this local path shape for synced repositories:
#
#   $HYPRBOLE_CONFIG_PATH/themes/.sources/<name>/themes
#
# User-authored or edited themes should go directly under:
#
#   $HYPRBOLE_CONFIG_PATH/themes/<theme-name>
#
# After editing this file, run:
#
#   hyprbole theme source sync
#
# Synced themes then appear in:
#
#   hyprbole theme list
#   hyprbole themes
#
# Example external theme source:
omarchy https://github.com/basecamp/omarchy.git dev themes $HYPRBOLE_CONFIG_PATH/themes/.sources/omarchy/themes
