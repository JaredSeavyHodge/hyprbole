site_name: Hyprbole Guide
site_description: User guide for the Hyprbole desktop layer
site_author: Hyprbole
docs_dir: src
use_directory_urls: false

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: black
      accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search

extra_css:
  - stylesheets/hyprbole.css

nav:
  - Welcome: index.md
  - Install: install.md
  - First Boot: first-boot.md
  - Commands: commands.md
  - Themes: themes.md
  - Browser: browser.md
  - Keybinds: keybinds.md
  - Packages: packages.md
  - Secret Service: secret-service.md
  - Troubleshooting: troubleshooting.md
