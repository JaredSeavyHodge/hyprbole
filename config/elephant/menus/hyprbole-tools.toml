name = "hyprbole-tools"
name_pretty = "Hyprbole Utilities"
hide_from_providerlist = true
parent = "hyprbole-system"
fixed_order = true

[[entries]]
text = "󰋊  Disk Usage"
subtext = "Inspect disk space with dua"
actions = { activate = "hyprbole launch disk-usage" }
state = ["sublevel"]

[[entries]]
text = "󰍛  System Monitor"
subtext = "Open btop"
actions = { activate = "hyprbole launch btop" }
state = ["sublevel"]

[[entries]]
text = "󰋼  System Info"
subtext = "Open Hyprland system information"
actions = { activate = "hyprbole system info" }
state = ["sublevel"]

[[entries]]
text = "  System Health"
subtext = "Show disk and OS health warnings"
actions = { activate = "hyprbole launch health" }
state = ["sublevel"]

[[entries]]
text = "󱦲  Mount Share"
subtext = "Mount a NAS SMB or NFS share"
actions = { activate = "hyprbole launch mount-share" }
state = ["sublevel"]

[[entries]]
text = "󰑓  Refresh Desktop"
subtext = "Refresh theme and runtime state"
actions = { activate = "hyprbole-refresh-all" }
state = ["sublevel"]

[[entries]]
text = "󰑐  Refresh Shipped Configs"
subtext = "Overwrite user configs with backups"
actions = { activate = "hyprbole-refresh-all --include-user-configs" }
state = ["sublevel"]
